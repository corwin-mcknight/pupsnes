MEMORY {
    ZP:      start = $0000,   size = $0100, type = rw, file = "";
    RAM:     start = $0200,   size = $1E00, type = rw, file = "";
    ROM:     start = $008000, size = $7FC0, type = ro, file = %O, fill = yes, fillval = $FF;
    HEADER:  start = $00FFC0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
    VECTORS: start = $00FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = RAM,     type = bss, define = yes;
    CODE:     load = ROM,     type = ro;
    RODATA:   load = ROM,     type = ro;
    HEADER:   load = HEADER,  type = ro;
    VECTORS:  load = VECTORS, type = ro;
}
