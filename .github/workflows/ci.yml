name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cc65 \
            clang \
            clang-format \
            clang-tidy \
            libgl1-mesa-dev \
            libx11-xcb-dev \
            libxcb-composite0-dev \
            libxcb-cursor-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-ewmh-dev \
            libxcb-glx0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-render0-dev \
            libxcb-res0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-util-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            ninja-build \
            xorg-dev

      - name: Install Python dependencies
        run: python -m pip install conan==2.32.0 cpplint==2.0.2

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ runner.arch }}-

      - name: Create Conan profile
        run: conan profile detect --force

      - name: Configure
        run: ./ci-verify.sh configure

      - name: Build
        run: ./ci-verify.sh build

      - name: Run unit tests
        run: ./ci-verify.sh test-unit

      - name: Run integration tests
        run: ./ci-verify.sh test-integration

      - name: Run additional tests
        run: ./ci-verify.sh test-additional

      - name: Run lint
        continue-on-error: true
        run: ./ci-verify.sh lint
